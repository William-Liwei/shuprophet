x-engine: &engine
  image: shuprophet-studio:local
  build:
    context: .
  environment:
    DATA_DIR: /data
    STUDIO_ACCESS_TOKEN: "${STUDIO_ACCESS_TOKEN:-}"
    WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
  volumes:
    - shuprophet-data:/data
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  shuprophet:
    <<: *engine
    command: ["web"]
    environment:
      DATA_DIR: /data
      STUDIO_ACCESS_TOKEN: "${STUDIO_ACCESS_TOKEN:-}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_API_BASE: "${OPENAI_API_BASE:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  worker:
    <<: *engine
    command: ["worker"]
    stop_grace_period: 2m

volumes:
  shuprophet-data:
