# Used by scripts/deploy.py. Values remain on the server, outside the release.
services:
  shuprophet:
    environment:
      OPENAI_API_KEY: ""
      OPENAI_API_KEY_FILE: /run/secrets/llm_api_key
    secrets:
      - llm_api_key

secrets:
  llm_api_key:
    file: "${SHU_SECRET_DIR:?Use scripts/deploy.py}/llm_api_key"
